            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Gerenciamento de Produtos</h1>
        
        <section class="form-section">
            <h2>Adicionar Novo Produto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="title">Título:</label>
                    <input type="text" id="title" name="title" required>
                    <span class="error-message" id="titleError"></span>
                </div>
                
                <div class="form-group">
                    <label for="description">Descrição:</label>
                    <textarea id="description" name="description" required></textarea>
                    <span class="error-message" id="descriptionError"></span>
                </div>
                
                <div class="form-group">
                    <label for="price">Preço:</label>
                    <input type="number" id="price" name="price" min="0.01" step="0.01" required>
                    <span class="error-message" id="priceError"></span>
                </div>
                
                <div class="form-group">
                    <label for="brand">Marca:</label>
                    <input type="text" id="brand" name="brand" required>
                    <span class="error-message" id="brandError"></span>
                </div>
                
                <div class="form-group">
                    <label for="category">Categoria:</label>
                    <input type="text" id="category" name="category" required>
                    <span class="error-message" id="categoryError"></span>
                </div>
                
                <div class="form-group">
                    <label for="photos">Fotos (URLs separadas por vírgula):</label>
                    <input type="text" id="photos" name="photos">
                    <span class="error-message" id="photosError"></span>
                </div>
                
                <button type="submit" class="btn-primary">Adicionar Produto</button>
            </form>
        </section>
        
        <section class="list-section">
            <h2>Lista de Produtos</h2>
            <div id="productsList" class="cards-container">
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Dummy Market. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
