<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Dummy - Usuários</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">Dummy Market</div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="users.html">Usuários</a></li>
                    <li><a href="products.html">Produtos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Gerenciamento de Usuários</h1>
        
        <section class="form-section">
            <h2>Adicionar Novo Usuário</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" required>
                    <span class="error-message" id="nameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="surname">Sobrenome:</label>
                    <input type="text" id="surname" name="surname" required>
                    <span class="error-message" id="surnameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="age">Idade:</label>
                    <input type="number" id="age" name="age" min="1" max="119" required>
                    <span class="error-message" id="ageError"></span>
                </div>
                
                <div class="form-group">
                    <label for="photo">Foto (URL):</label>
                    <input type="url" id="photo" name="photo">
                    <span class="error-message" id="photoError"></span>
                </div>
                
                <button type="submit" class="btn-primary">Adicionar Usuário</button>
            </form>
        </section>
        
        <section class="list-section">
            <h2>Lista de Usuários</h2>
            <div id="usersList" class="cards-container">
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Dummy Market. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
